<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Turmas - UERJHUB</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <style>
        .disciplines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: -50px;
            position: relative;
            padding: 0 20px;
        }
        .disc-card {
            background: white; border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s;
            cursor: pointer; border-left: 5px solid #0b84c8; text-decoration: none;
            display: block; /* Para funcionar como link */
        }
        .disc-card:hover { transform: translateY(-5px); }
        .disc-card h3 { color: #333; margin-bottom: 5px; font-size: 1.1em; }
        .disc-card span { color: #666; font-size: 0.9em; display: block; }
    </style>
</head>
<body>
    <header class="px-5 py-4" style="background: url('images/v105_14.png') no-repeat center center; background-size: cover; height: 30vh;"></header>

    <div class="container" style="max-width: 1200px; margin: 0 auto;">
        <h2 style="color: white; margin-left: 20px; margin-top: -80px; position: relative; z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Selecione a Turma</h2>
        
        <div id="loading" style="text-align: center; margin-top: 50px; color: white;">Carregando...</div>
        <div id="disciplinesGrid" class="disciplines-grid"></div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="window.location.href='dashboard.html'" class="btn-cadastrar" style="width: auto;">Voltar ao Painel</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        async function loadDisciplines() {
            try {
                const res = await fetch('http://localhost:8000/disciplines/mine', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                document.getElementById('loading').style.display = 'none';

                if (res.ok) {
                    const turmas = await res.json();
                    const grid = document.getElementById('disciplinesGrid');
                    
                    if (turmas.length === 0) {
                        grid.innerHTML = "<p style='background:white; padding:20px; border-radius:10px;'>Nenhuma turma encontrada.</p>";
                        return;
                    }

                    turmas.forEach(d => {
                        const card = document.createElement('a'); // Agora é um LINK
                        card.className = 'disc-card';
                        // AQUI ESTÁ O SEGREDO: Passa o ID na URL
                        card.href = `class.html?id=${d._id}`; 
                        
                        const horario = d.horario && d.horario.length ? d.horario.join(' | ') : 'Sem horário';
                        card.innerHTML = `
                            <h3>${d.nome}</h3>
                            <span><strong>${d.codigo}</strong> - Turma ${d.turma}</span>
                            <span style="margin-top:5px;"><i class="far fa-clock"></i> ${horario}</span>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (e) { console.error(e); }
        }
        loadDisciplines();
    </script>
</body>
</html>
