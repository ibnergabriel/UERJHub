<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - UERJHUB</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* RESET E FUNDO IGUAL AO LOGIN */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Fundo UERJ com sobreposição azulada */
            background: linear-gradient(rgba(0, 50, 100, 0.6), rgba(0, 50, 100, 0.6)), 
                        url('images/v105_14.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* CARD CENTRALIZADO */
        .login-card {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-card img.logo { width: 80px; margin-bottom: 15px; }
        .login-card h2 { color: #333; margin-bottom: 10px; font-weight: 700; }
        .login-card p.text { color: #666; font-size: 0.9em; margin-bottom: 25px; line-height: 1.5; }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 15px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; }
        .input-group input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; background: #f9f9f9;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: #004aad; background: #fff; }

        /* MENSAGEM DE ERRO (SENHAS) */
        small.error-msg {
            color: #d9534f; font-size: 0.8em; display: none; margin-top: 5px; font-weight: bold; text-align: left; padding-left: 5px;
        }

        /* BOTÕES */
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-primary { background-color: #004aad; color: white; }
        .btn-primary:hover { background-color: #003380; transform: translateY(-2px); }
        .btn-text { background: none; color: #666; font-size: 0.9em; }
        .btn-text:hover { color: #004aad; text-decoration: underline; }

        /* UTILITÁRIOS */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="images/v105_24.png" alt="Logo UERJ" class="logo">
        
        <div id="step1-container">
            <h2>Recuperar Senha</h2>
            <p class="text">Digite seu e-mail cadastrado. Enviaremos um código de segurança para você.</p>
            
            <form onsubmit="solicitarCodigo(event)">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="emailInput" placeholder="seu_email@graduacao.uerj.br" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btnEnviar">ENVIAR CÓDIGO</button>
                <button type="button" class="btn btn-text" onclick="window.location.href='login.html'">Voltar para o Login</button>
            </form>
        </div>

        <div id="step2-container" class="hidden">
            <h2>Definir Nova Senha</h2>
            <p class="text" style="color: green; margin-bottom: 15px;">Código enviado para: <br><b id="emailDisplay"></b></p>
            
            <form onsubmit="redefinirSenha(event)">
                <div class="input-group">
                    <i class="fas fa-key"></i>
                    <input type="text" id="tokenInput" placeholder="Código de 6 dígitos" maxlength="6" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPasswordInput" placeholder="Nova Senha" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="confirmPasswordInput" placeholder="Confirme a Nova Senha" required>
                    <small id="senhaErro" class="error-msg">As senhas não coincidem.</small>
                </div>

                <button type="submit" class="btn btn-primary" id="btnReset">SALVAR SENHA</button>
                <button type="button" class="btn btn-text" onclick="window.location.reload()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000"; 

        // --- Passo 1: Solicitar Token ---
        async function solicitarCodigo(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const btn = document.getElementById('btnEnviar');

            if (!email) return;

            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('step1-container').classList.add('hidden');
                    document.getElementById('step2-container').classList.remove('hidden');
                    document.getElementById('emailDisplay').innerText = email;
                    alert("Verifique seu e-mail (e a caixa de Spam)!");
                } else {
                    alert(`Erro: ${data.detail || "Falha ao conectar."}`);
                }
            } catch (error) {
                console.error(error);
                alert("Erro de conexão. Verifique se o servidor backend está rodando.");
            } finally {
                btn.innerText = "ENVIAR CÓDIGO";
                btn.disabled = false;
            }
        }

        // --- Passo 2: Redefinir Senha ---
        async function redefinirSenha(event) {
            event.preventDefault();
            
            const email = document.getElementById('emailDisplay').innerText;
            const token = document.getElementById('tokenInput').value.trim();
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value; // <--- NOVO
            const erroMsg = document.getElementById('senhaErro');

            // 1. Validação Visual: Senhas Iguais?
            if (newPassword !== confirmPassword) {
                erroMsg.style.display = 'block';
                document.getElementById('confirmPasswordInput').focus();
                // Não envia nada para o servidor se estiver errado
                return;
            } else {
                erroMsg.style.display = 'none';
            }

            // 2. Envio para o Backend
            const btn = document.getElementById('btnReset');
            btn.innerText = "SALVANDO...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        token: token, 
                        new_password: newPassword,
                        confirm_new_password: confirmPassword // Envia a confirmação para validação dupla no backend
                    })
                });

                if (response.ok) {
                    alert("Senha alterada com sucesso! Faça login com sua nova senha.");
                    window.location.href = 'login.html';
                } else {
                    const data = await response.json();
                    alert(`Erro: ${data.detail}`);
                }
            } catch (error) {
                console.error(error);
                alert("Erro ao alterar senha.");
            } finally {
                btn.innerText = "SALVAR SENHA";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
