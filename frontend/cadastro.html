<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans&display=swap" rel="stylesheet" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="FIGMA\FIGMA\images/logomarca-uerj">
</head>
<body>
    <!-- <header class="px-5 py-4" style="background: url('images/v105_14.png') no-repeat center center; background-size: cover; height: 200px;">
        <span class="auth-title">Autenticação</span>
        <div>
            <img src="images/v105_14.png" alt="Árvore UERJ" style="width: 100%; height: auto; display: block;">

    <header class="px-5 py-4" style="background: url('images/v105_14.png') no-repeat center center; background-size: cover; height: 50vh;" >
        <!-- <span class="auth-title">Autenticação</span> -->
            <div>
                <img src="images/v105_14.png" alt="Árvore UERJ" style="width: 0%; height: auto; display: block;">
            </div>
            
    </header>
    <div class="espacamento"></div>
    <div class="v172_551"></div>
    <div class="login-container-cadastro">
        <h2>Cadastre-se</h2>
        <form action="#" method="POST">
            <!-- <div class="form-group">
                <label for="usuario" class="sr-only">Nome</label>
                <div class="input-with-icon">
                    <input type="text" id="nome" name="nome" placeholder="nome" required>
                </div>
            </div> -->
        <div class="form-grid">
              <div class="left-column">
                        <div class="form-group">
                            <label for="nome">Nome</label> 
                            <div class="input-with-icon">
                                <input type="text" id="nome" name="nome" placeholder="nome" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <div class="input-with-icon">
                                <input type="text" id="email" name="email" placeholder="e-mail" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="curso">Curso</label>
                            <div class="input-with-icon">
                                <input type="text" id="curso" name="curso" placeholder="curso" required>
                            </div>
                        </div>
            </div>  

                    <div class="right-column">

                        <div class="form-group period-group">
                            <label for="inicio_periodo">Período</label>
                            <div class="input-with-icon period-inputs">
                                <input type="text" id="inicio_periodo" name="inicio_periodo" placeholder="início" required>
                                <input type="text" id="fim_periodo" name="fim_periodo" placeholder="fim" required>
                            </div>
                        </div> 

                        <div class="form-group">
                            <label for="senha">Senha</label>
                            <div class="input-with-icon">
                                <input type="password" id="senha" name="senha" placeholder="senha" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmacao_senha">Senha</label>
                            <div class="input-with-icon">
                                <input type="password" id="confirmacao_senha" name="confirmacao_senha" placeholder="confirmação de senha" required>
                            </div>
                        </div> 
                        
                    </div> 
        </div>


            <div class="buttons-group">
                <button type="submit" class="btn-azul">Cadastrar</button>
                <!-- <button type="button" class="btn-branco">Cadastrar</button> -->
            </div>
        <div class="logo-bottom">
            <img src="images/v105_24.png" alt="Logo UERJ">
        </div>
        </form>

    </div>
</body>
</html>
