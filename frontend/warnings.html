<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos - UERJHUB</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    
    <style>
        .warnings-container {
            max-width: 900px; margin: -50px auto 0 auto; padding: 20px;
            position: relative; z-index: 2;
        }

        /* Filtros */
        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 20px; justify-content: center;
        }
        .filter-btn {
            background: white; border: none; padding: 10px 20px; border-radius: 20px;
            cursor: pointer; font-weight: bold; color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .filter-btn.active { background: #0b84c8; color: white; }
        .filter-btn:hover { transform: translateY(-2px); }

        /* Card de Aviso */
        .warning-card {
            background: white; border-radius: 10px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid #ccc; position: relative;
        }

        /* Cores por Tipo */
        .type-geral { border-left-color: #0b84c8; }
        .type-urgencia { border-left-color: #ff4d4d; }
        .type-oportunidade { border-left-color: #28a745; }

        .tag-type {
            position: absolute; top: 20px; right: 20px;
            font-size: 0.8em; padding: 4px 10px; border-radius: 5px;
            text-transform: uppercase; font-weight: bold; color: white;
        }
        .bg-geral { background: #0b84c8; }
        .bg-urgencia { background: #ff4d4d; }
        .bg-oportunidade { background: #28a745; }

        .btn-postar {
            position: fixed; bottom: 30px; right: 30px;
            background: #0b84c8; color: white; width: 60px; height: 60px;
            border-radius: 50%; font-size: 30px; border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Modal de Postagem */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-form { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px; }
        .form-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <header class="px-5 py-4" style="background: url('images/v105_14.png') no-repeat center center; background-size: cover; height: 30vh;"></header>

    <div class="warnings-container">
        <h2 style="color: white; text-align: center; margin-bottom: 30px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Mural da UERJ</h2>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filtrar('todos')">Todos</button>
            <button class="filter-btn" onclick="filtrar('geral')">Geral</button>
            <button class="filter-btn" onclick="filtrar('oportunidade')">Estágios</button>
            <button class="filter-btn" onclick="filtrar('urgencia')">Urgente</button>
        </div>

        <div id="listaAvisos">
            <p style="text-align:center; color: white;">Carregando...</p>
        </div>
        
        <div style="text-align: center; margin-top: 30px;">
             <button onclick="window.location.href='dashboard.html'" class="filter-btn">Voltar ao Painel</button>
        </div>
    </div>

    <button class="btn-postar" onclick="abrirModal()" title="Novo Aviso">
        <i class="fas fa-plus"></i>
    </button>

    <div id="modalAviso" class="modal-overlay">
        <div class="modal-form">
            <h3>Novo Aviso Geral</h3>
            <select id="novoTipo" class="form-input">
                <option value="geral">Geral</option>
                <option value="oportunidade">Oportunidade / Estágio</option>
                <option value="urgencia">Urgente</option>
            </select>
            <input type="text" id="novoTitulo" placeholder="Título" class="form-input">
            <textarea id="novoMsg" placeholder="Mensagem..." class="form-input" rows="4"></textarea>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-cadastrar" onclick="postarAviso()" style="flex: 1;">Publicar</button>
                <button class="btn-cadastrar" onclick="fecharModal()" style="flex: 1; background: #ccc;">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let filtroAtual = 'todos';

        async function carregarAvisos() {
            let url = 'http://localhost:8000/warnings/';
            
            // Se não for 'todos', aplica o filtro de tipo
            if (filtroAtual !== 'todos') {
                url += `?tipo=${filtroAtual}`;
            }

            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const avisos = await res.json();
                renderizar(avisos);
            } catch (e) {
                console.error(e);
            }
        }

        function renderizar(avisos) {
            const container = document.getElementById('listaAvisos');
            container.innerHTML = "";

            if (avisos.length === 0) {
                container.innerHTML = "<div class='warning-card'><p>Nenhum aviso encontrado.</p></div>";
                return;
            }

            avisos.forEach(av => {
                const data = new Date(av.created_at).toLocaleDateString('pt-BR');
                const tipoClass = `type-${av.tipo}`;
                const bgClass = `bg-${av.tipo}`;

                const html = `
                    <div class="warning-card ${tipoClass}">
                        <span class="tag-type ${bgClass}">${av.tipo}</span>
                        <h3>${av.titulo}</h3>
                        <p style="margin: 10px 0; color: #555;">${av.mensagem}</p>
                        <small style="color: #999;">Postado em ${data}</small>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function filtrar(tipo) {
            filtroAtual = tipo;
            
            // Atualiza botões
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            carregarAvisos();
        }

        // --- POSTAR AVISO ---
        function abrirModal() { document.getElementById('modalAviso').style.display = 'flex'; }
        function fecharModal() { document.getElementById('modalAviso').style.display = 'none'; }

        async function postarAviso() {
            const tipo = document.getElementById('novoTipo').value;
            const titulo = document.getElementById('novoTitulo').value;
            const msg = document.getElementById('novoMsg').value;

            if (!titulo || !msg) return alert("Preencha tudo!");

            const payload = {
                tipo: tipo,
                titulo: titulo,
                mensagem: msg,
                disciplina_id: null, // É um aviso geral!
                autor_id: "temp" // Backend resolve
            };

            try {
                const res = await fetch('http://localhost:8000/warnings/', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Aviso publicado!");
                    fecharModal();
                    carregarAvisos();
                } else {
                    alert("Erro ao publicar.");
                }
            } catch (e) { console.error(e); }
        }

        carregarAvisos();
    </script>
</body>
</html>
